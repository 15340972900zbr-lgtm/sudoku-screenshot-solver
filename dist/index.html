<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5ef"><meta name="description" content="上传数独截图，核对数字与约束，自动求解。"><title>数独截图求解器</title><link rel="stylesheet" href="./style.css"></head>
<body><main class="shell">
  <header class="top"><div class="brand"><span class="brand-mark">9<span>×</span>9</span><span>数独截图求解器</span></div><nav class="top-links"><a href="./tips.html">技巧教学</a><span class="tag">手机可用</span></nav></header>
  <section class="intro"><div class="eyebrow">拍下题目 · 核对识别 · 得到答案</div><h1>把截图变成<br><em>可以求解的棋盘。</em></h1><p>支持经典、无马、杀手、对角线、奇偶、连续、不规则宫和窗口规则，也可组合使用。</p></section>
  <section class="upload-card"><label class="upload" for="file"><span class="upload-icon">＋</span><span><strong>选择或拍摄数独截图</strong><small>JPG、PNG、WebP · 请保留完整 9×9 棋盘</small></span></label><input id="file" type="file" accept="image/*"><div id="image-wrap" class="image-wrap hidden"><img id="photo" alt="已上传的数独截图"><div id="crop-label">已找到棋盘</div></div><div id="board-photo-wrap" class="board-photo-wrap hidden"><div class="eyebrow">原题局部 · 可对照下方识别结果</div><canvas id="board-photo" aria-label="截图中的数独棋盘"></canvas></div><p id="status" class="status" role="status">选择截图后会自动识别。首次使用可能需要加载识别组件。</p></section>
  <section class="workspace"><div class="section-head"><div><div class="eyebrow">01 / 核对题目</div><h2>识别结果</h2></div><button id="reset" class="text-button" type="button">清空</button></div>
    <div class="rule-list" id="rule-list" aria-label="数独规则"></div>
    <p id="rule-hint" class="helper">无马等题型若没有可见标记，请核对自动推断结果。连续数独中，未标记的相邻格不能填连续数字。</p>
    <div class="board-wrap"><div id="board" class="board" role="grid" aria-label="数独棋盘"></div></div>
    <div class="editor"><div class="editor-top"><span>编辑方式</span><div class="segmented" id="modes"><button class="active" data-mode="number">数字</button><button data-mode="parity">奇偶</button><button data-mode="link">连续</button><button data-mode="cage">笼</button><button data-mode="region">宫</button></div></div><div id="mode-help" class="helper">点选格子，再点下方数字。空格键可清除。</div><div id="numpad" class="numpad"></div><div id="cage-tools" class="cage-tools hidden"><input id="cage-sum" type="number" inputmode="numeric" min="1" max="45" placeholder="笼内合计"><button id="save-cage" type="button">保存所选笼</button><button id="clear-selection" type="button" class="quiet">取消选择</button></div><div id="region-tools" class="region-tools hidden"><div id="region-palette" class="region-palette" aria-label="选择宫号"></div><button id="reset-regions" type="button" class="quiet">重置宫格</button></div></div>
    <button id="solve" class="solve-button" type="button">求解并显示答案 <span>→</span></button><div id="result" class="result hidden" aria-live="polite"></div>
  </section><footer>截图仅在当前浏览器内处理。识别可能受遮挡、动画和压缩影响，求解前请核对原题。</footer>
</main><script src="./ocr/tesseract.min.js" defer></script><script type="module" src="./app.mjs"></script></body></html>
